<div class="step-content">

    <h3>Report Details</h3>

    <p class="step-description">
        Tell us what happened and who you are reporting.
    </p>


    <!-- ================================= -->
    <!-- REPORT CATEGORY -->
    <!-- ================================= -->

    <div class="form-group">

        <label for="reportCategory">
            Select a reason for your report
            <span class="required">*</span>
        </label>

        <select
            id="reportCategory"
            name="category"
            required
        >

            <option value="" selected disabled>
                Choose a report category
            </option>

            <option value="Landlord did not follow declared price of unit">
                Landlord did not follow declared price of unit
            </option>

            <option value="Listing included offensive statements">
                Listing included offensive statements
            </option>

            <option value="Misleading photos or information">
                Misleading photos or information
            </option>

            <option value="Landlord was unresponsive or unprofessional">
                Landlord was unresponsive or unprofessional
            </option>

            <option value="Safety concerns / suspicious activity">
                Safety concerns / suspicious activity
            </option>

            <option value="Violation of platform rules or policies">
                Violation of platform rules or policies
            </option>

            <option value="Fraudulent listing (fake or duplicate)">
                Fraudulent listing (fake or duplicate)
            </option>

            <option value="Others">
                Others
            </option>

        </select>

    </div>


    <!-- ================================= -->
    <!-- OTHER CATEGORY -->
    <!-- ================================= -->

    <div
        class="form-group"
        id="otherCategoryGroup"
        hidden
    >

        <label for="otherCategory">
            Please specify
            <span class="required">*</span>
        </label>

        <input
            type="text"
            id="otherCategory"
            name="other_category"
            placeholder="Please describe the issue"
            maxlength="100"
        >

    </div>


    <!-- ================================= -->
    <!-- LANDLORD -->
    <!-- ================================= -->

    <div class="form-group">

        <label for="reportedUser">
            Select the landlord
            <span class="required">*</span>
        </label>

        <select
            id="reportedUser"
            name="reported_user"
            required
        >

            <option value="" selected disabled>
                Choose a landlord
            </option>

            {% for landlord in landlords %}

                <option value="{{ landlord.id }}">
                    {{ landlord.get_full_name }}
                </option>

            {% endfor %}

        </select>

    </div>


    <!-- ================================= -->
    <!-- DESCRIPTION -->
    <!-- ================================= -->

    <div class="form-group">

        <div class="label-row">

            <label for="reportDescription">
                Provide details
                <span class="required">*</span>
            </label>

            <span id="characterCount">
                0/500
            </span>

        </div>

        <textarea
            id="reportDescription"
            name="description"
            rows="5"
            maxlength="500"
            required
            placeholder="Please describe what happened. Include relevant details such as dates, conversations, or specific information."
        ></textarea>

    </div>

</div>
