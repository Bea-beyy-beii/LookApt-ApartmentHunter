<div class="step-content">

    <h3>Report Details</h3>

    <p class="step-description">
        Tell us what happened and who you are reporting.
    </p>


    <!-- ================================= -->
    <!-- REPORT CATEGORY -->
    <!-- ================================= -->

    <div class="form-group">

        <label for="reportCategory">
            Select a reason for your report
            <span class="required">*</span>
        </label>

        <select
            id="reportCategory"
            name="category"
            required
        >

            <option value="" selected disabled>
                Choose a report category
            </option>

            <option value="Renter failed to follow rental agreement">
                Renter failed to follow rental agreement
            </option>

            <option value="Renter caused property damage">
                Renter caused property damage
            </option>

            <option value="Renter failed to pay agreed amount">
                Renter failed to pay agreed amount
            </option>

            <option value="Renter was unresponsive or unprofessional">
                Renter was unresponsive or unprofessional
            </option>

            <option value="Suspicious or fraudulent activity">
                Suspicious or fraudulent activity
            </option>

            <option value="Violation of platform rules or policies">
                Violation of platform rules or policies
            </option>

            <option value="Others">
                Others
            </option>

        </select>

    </div>


    <!-- ================================= -->
    <!-- OTHER CATEGORY -->
    <!-- ================================= -->

    <div
        class="form-group"
        id="otherCategoryGroup"
        hidden
    >

        <label for="otherCategory">
            Please specify
            <span class="required">*</span>
        </label>

        <input
            type="text"
            id="otherCategory"
            name="other_category"
            placeholder="Please describe the issue"
            maxlength="100"
        >

    </div>


    <!-- ================================= -->
    <!-- RENTER -->
    <!-- ================================= -->

    <div class="form-group">

        <label for="reportedUser">
            Select the renter
            <span class="required">*</span>
        </label>

        <select
            id="reportedUser"
            name="reported_user"
            required
        >

            <option value="" selected disabled>
                Choose a renter
            </option>

            {% for renter in renters %}

                <option value="{{ renter.id }}">
                    {{ renter.get_full_name }}
                </option>

            {% endfor %}

        </select>

    </div>


    <!-- ================================= -->
    <!-- DESCRIPTION -->
    <!-- ================================= -->

    <div class="form-group">

        <div class="label-row">

            <label for="reportDescription">
                Provide details
                <span class="required">*</span>
            </label>

            <span id="characterCount">
                0/500
            </span>

        </div>

        <textarea
            id="reportDescription"
            name="description"
            rows="5"
            maxlength="500"
            required
            placeholder="Please describe what happened. Include relevant details such as dates, conversations, or specific information."
        ></textarea>

    </div>

</div>
