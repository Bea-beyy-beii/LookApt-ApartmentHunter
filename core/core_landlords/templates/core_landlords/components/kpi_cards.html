<div class="kpi-grid">

    <!-- Total Listings -->
    <article class="kpi-card kpi-listings">
        <div class="kpi-content">
            <span class="kpi-label">Total Listings</span>

            <strong class="kpi-value">3</strong>

            <span class="kpi-description">
                Properties / Complexes
            </span>
        </div>
    </article>


    <!-- Total Units -->
    <article class="kpi-card kpi-units">
        <div class="kpi-content">
            <span class="kpi-label">Total Units</span>

            <strong class="kpi-value">18</strong>

            <span class="kpi-description">
                Units across all properties
            </span>

            <span class="kpi-trend">
                12 occupied · 6 vacant
            </span>
        </div>

        <div class="unit-donut-wrapper">

            <div class="unit-donut">
                <div class="unit-donut-center">
                    <strong>18</strong>
                    <span>units</span>
                </div>
            </div>

            <div class="unit-legend">
                <span>
                    <i class="legend-dot occupied"></i>
                    12 Occupied
                </span>

                <span>
                    <i class="legend-dot vacant"></i>
                    6 Vacant
                </span>
            </div>

        </div>
    </article>


    <!-- Inquiries -->
    <article class="kpi-card kpi-inquiries">

        <div class="kpi-content">
            <span class="kpi-label">Inquiries</span>

            <div class="inquiry-stats">

                <div>
                    <strong class="kpi-value">5</strong>
                    <span>Active</span>
                </div>

                <div class="inquiry-divider"></div>

                <div>
                    <strong class="kpi-value pending-number">2</strong>
                    <span>Pending</span>
                </div>

            </div>
        </div>

    </article>


    <!-- Monthly Receivables -->
    <article class="kpi-card kpi-receivables">

        <div class="kpi-content">

            <span class="kpi-label">
                Monthly Receivables
            </span>

            <strong class="kpi-value receivable-value">
                ₱180,000
            </strong>

            <span class="kpi-description">
                From 12 occupied units
            </span>

            <button
                type="button"
                class="kpi-action"
                data-action="view-receivables"
            >
                View Details
                <span aria-hidden="true">→</span>
            </button>

        </div>

    </article>

</div>
