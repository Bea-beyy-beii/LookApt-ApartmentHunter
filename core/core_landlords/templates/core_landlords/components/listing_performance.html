{% load static %}
<section class="dashboard-panel listing-performance-panel">

    <div class="panel-header">

        <div class="panel-title-group">

            <span class="panel-title-icon" aria-hidden="true">
                ▥
            </span>

            <h2>Listing Performance</h2>

        </div>


        <select
            class="performance-period"
            aria-label="Performance period"
        >
            <option value="month">This Month</option>
            <option value="week">This Week</option>
            <option value="week">This Day</option>
            <option value="year">This Year</option>
        </select>

    </div>


    <!-- Performance Summary -->
    <div class="performance-stats">

        <!-- Views -->
        <div class="performance-stat views">

            <span
                class="performance-stat-icon"
                aria-hidden="true"
            >
                ◉
            </span>

            <div>
                <strong>482</strong>

                <span>Listing Views</span>

                <small class="positive">
                    ↑ 12%
                </small>
            </div>

        </div>


        <!-- Saves -->
        <div class="performance-stat saves">

            <span
                class="performance-stat-icon"
                aria-hidden="true"
            >
                ♡
            </span>

            <div>
                <strong>37</strong>

                <span>Saves</span>

                <small class="positive">
                    ↑ 8%
                </small>
            </div>

        </div>


        <!-- Inquiries -->
        <div class="performance-stat inquiries">

            <span
                class="performance-stat-icon"
                aria-hidden="true"
            >
                ▢
            </span>

            <div>
                <strong>24</strong>

                <span>Inquiries</span>

                <small class="positive">
                    ↑ 14%
                </small>
            </div>

        </div>


        <!-- Successful Rentals -->
        <div class="performance-stat rentals">

            <span
                class="performance-stat-icon"
                aria-hidden="true"
            >
                ✓
            </span>

            <div>
                <strong>6</strong>

                <span>Successful Rentals</span>

                <small class="positive">
                    ↑ 50%
                </small>
            </div>

        </div>

    </div>


    <!-- Chart -->
    <div class="performance-chart">

        <div class="chart-y-axis">
            <span>200</span>
            <span>150</span>
            <span>100</span>
            <span>50</span>
            <span>0</span>
        </div>


        <div class="chart-area">

            <!-- Grid -->
            <div class="chart-grid">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>


            <!-- Placeholder SVG chart -->
            <svg
                class="performance-line-chart"
                viewBox="0 0 700 220"
                preserveAspectRatio="none"
                aria-label="Listing performance chart"
                role="img"
            >

                <!-- Views -->
                <polyline
                    class="chart-line chart-views"
                    points="
                        0,160
                        50,145
                        100,115
                        150,130
                        200,100
                        250,115
                        300,70
                        350,90
                        400,60
                        450,80
                        500,105
                        550,65
                        600,35
                        650,55
                        700,95
                    "
                />

                <!-- Saves -->
                <polyline
                    class="chart-line chart-saves"
                    points="
                        0,190
                        50,175
                        100,170
                        150,175
                        200,155
                        250,165
                        300,135
                        350,145
                        400,125
                        450,140
                        500,150
                        550,125
                        600,105
                        650,125
                        700,135
                    "
                />

                <!-- Inquiries -->
                <polyline
                    class="chart-line chart-inquiries"
                    points="
                        0,205
                        50,195
                        100,190
                        150,195
                        200,180
                        250,185
                        300,165
                        350,175
                        400,155
                        450,170
                        500,175
                        550,155
                        600,140
                        650,150
                        700,160
                    "
                />

                <!-- Successful Rentals -->
                <polyline
                    class="chart-line chart-rentals"
                    points="
                        0,215
                        50,210
                        100,205
                        150,210
                        200,200
                        250,205
                        300,195
                        350,200
                        400,185
                        450,195
                        500,200
                        550,185
                        600,175
                        650,185
                        700,190
                    "
                />

            </svg>


            <!-- X Axis -->
            <div class="chart-x-axis">
                <span>Oct 1</span>
                <span>Oct 7</span>
                <span>Oct 14</span>
                <span>Oct 21</span>
                <span>Oct 28</span>
                <span>Oct 31</span>
            </div>

        </div>


        <!-- Chart Legend -->
        <div class="chart-legend">

            <span>
                <i class="chart-dot views"></i>
                Views
            </span>

            <span>
                <i class="chart-dot saves"></i>
                Saves
            </span>

            <span>
                <i class="chart-dot inquiries"></i>
                Inquiries
            </span>

            <span>
                <i class="chart-dot rentals"></i>
                Successful Rentals
            </span>

        </div>

    </div>

</section>
